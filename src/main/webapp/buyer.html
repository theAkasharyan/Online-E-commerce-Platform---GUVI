<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront | Buyer Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-shop me-2"></i>E-Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#buyerNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="buyerNav">
                <form class="d-flex mx-auto my-2 my-lg-0 w-50" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search products, brands, categories..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
                </form>
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-house me-1"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#orders"><i class="bi bi-box-seam me-1"></i>Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="#wishlist"><i class="bi bi-heart me-1"></i>Wishlist</a></li>
                    <li class="nav-item ms-lg-2">
                        <button class="btn btn-primary position-relative">
                            <i class="bi bi-cart3"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">2</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-4">
        <!-- Banner -->
        <div class="p-4 p-md-5 mb-4 rounded text-bg-primary">
            <div class="col-md-8 px-0">
                <h1 class="display-6 fw-bold">Explore Campus Tech & Gear</h1>
                <p class="lead my-3">Find verified electronics, books, and accessories sold by peer campus sellers.</p>
                <a href="#catalog" class="btn btn-light btn-lg fw-semibold">Shop Now</a>
            </div>
        </div>
      
        <div class="row mb-3 align-items-center" id="catalog">
            <div class="col-md-6">
                <h3 class="fw-bold mb-0">Product Catalog</h3>
            </div>
            <div class="col-md-6 text-md-end mt-2 mt-md-0">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-secondary btn-sm active">All</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm">Peripherals</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm">Components</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm">Accessories</button>
                </div>
            </div>
        </div>

        <!-- Product Cards Grid -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
            <div class="col">
                <div class="card h-100 shadow-sm border-0">
                    <div class="bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center text-muted" style="height: 180px;">
                        <i class="bi bi-keyboard display-4"></i>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <span class="badge bg-light text-dark border align-self-start mb-2">Keyboards</span>
                        <h6 class="card-title fw-bold">Mechanical Keyboard</h6>
                        <p class="card-text text-muted small flex-grow-1">Hot-swappable tactile blue switches with RGB backlight.</p>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <span class="fs-5 fw-bold text-primary">\$79.99</span>
                            <span class="badge bg-success-subtle text-success border border-success-subtle">In Stock</span>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 pt-0 pb-3 d-flex gap-2">
                        <button class="btn btn-primary btn-sm flex-grow-1"><i class="bi bi-cart-plus me-1"></i>Add</button>
                        <button class="btn btn-outline-danger btn-sm"><i class="bi bi-heart"></i></button>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 shadow-sm border-0">
                    <div class="bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center text-muted" style="height: 180px;">
